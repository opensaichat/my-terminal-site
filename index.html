<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDEX-UI Web + 3D Globe</title>
    <!-- Подключаем Three.js для 3D графики -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --bg-color: #050505;
            --panel-bg: rgba(0, 242, 255, 0.05);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color);
            color: var(--neon-blue);
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; z-index: 10;
        }

        .ui-container {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            grid-template-rows: 60px 1fr 150px;
            height: 100vh; gap: 10px; padding: 10px;
            position: relative; z-index: 1;
        }

        .panel {
            border: 1px solid var(--neon-blue);
            background: rgba(0, 0, 0, 0.85);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.15);
            padding: 10px; overflow: hidden;
            position: relative;
        }

        .header { grid-column: 1 / 4; display: flex; justify-content: space-between; align-items: center; }
        .main-terminal { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; }
        
        /* Контейнер для глобуса */
        #globe-container {
            width: 100%;
            height: 250px;
            margin-top: 10px;
            cursor: move;
        }

        #terminal-output { flex-grow: 1; overflow-y: auto; font-size: 14px; }
        .input-line { display: flex; border-top: 1px solid var(--neon-blue); padding-top: 5px; }
        #user-input {
            background: transparent; border: none; color: var(--neon-blue);
            font-family: inherit; font-size: 16px; outline: none; width: 100%;
        }

        .stat-bar { height: 8px; background: #111; margin: 5px 0; border: 1px solid var(--neon-blue); }
        .stat-fill { height: 100%; background: var(--neon-blue); width: 50%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="ui-container">
        <header class="panel header">
            <div>STATUS: ENCRYPTED</div>
            <div id="clock">00:00:00</div>
            <div>GEOLOCATION: ACTIVE</div>
        </header>

        <!-- Левая панель: Статистика -->
        <aside class="panel">
            <h4 style="margin:0">CORE_MONITOR</h4>
            <div class="stat-bar"><div class="stat-fill" id="cpu-bar"></div></div>
            <div class="stat-bar"><div class="stat-fill" id="ram-bar" style="width: 65%;"></div></div>
            <div style="font-size: 11px; margin-top: 20px; line-height: 1.5;">
                > VOLTAGE: 1.2V<br>
                > TEMP: 42°C<br>
                > FAN_SPEED: 2400 RPM
            </div>
        </aside>

        <!-- Центр: Терминал -->
        <main class="panel main-terminal">
            <div id="terminal-output">Инициализация протоколов eDEX...<br>Связь установлена.</div>
            <div class="input-line">
                <span>$></span>
                <input type="text" id="user-input" autofocus>
            </div>
        </main>

        <!-- Правая панель: Глобус -->
        <aside class="panel">
            <h4 style="margin:0; text-align: center;">GLOBAL_TRACKER</h4>
            <div id="globe-container"></div>
            <div style="font-size: 10px; text-align: center; opacity: 0.7;">
                LAT: 59.93 | LONG: 30.33
            </div>
        </aside>

        <footer class="panel" style="grid-column: 1/4; display: flex; justify-content: space-around; align-items: center; opacity: 0.6;">
            <span>[ NETWORK_TRAFFIC: ████░░░░░░ 40% ]</span>
            <span>[ DISK_WRITE: OK ]</span>
            <span>[ ENCRYPTION: RSA-4096 ]</span>
        </footer>
    </div>

    <script>
        // 1. Часы
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // 2. Симуляция загрузки CPU
        setInterval(() => {
            document.getElementById('cpu-bar').style.width = Math.floor(Math.random() * 100) + '%';
        }, 1500);

        // 3. Терминал
        const input = document.getElementById('user-input');
        const output = document.getElementById('terminal-output');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value;
                output.innerHTML += `<div><span style="color:#fff">></span> ${cmd}</div>`;
                input.value = '';
                output.scrollTop = output.scrollHeight;
            }
        });

        // 4. ТРЕХМЕРНЫЙ ГЛОБУС (Three.js)
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(container.offsetWidth, container.offsetHeight);
        container.appendChild(renderer.domElement);

        // Создаем геометрию сферы (глобус)
        const geometry = new THREE.SphereGeometry(5, 32, 32);
        // Материал в стиле "сетки" (wireframe)
        const material = new THREE.MeshBasicMaterial({
            color: 0x00f2ff,
            wireframe: true,
            transparent: true,
            opacity: 0.6
        });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Добавляем внутреннюю подсветку (вторая сфера чуть меньше)
        const innerGeom = new THREE.SphereGeometry(4.8, 16, 16);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.1 });
        const innerGlobe = new THREE.Mesh(innerGeom, innerMat);
        scene.add(innerGlobe);

        camera.position.z = 10;

        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += 0.005; // Вращение
            globe.rotation.x += 0.001;
            renderer.render(scene, camera);
        }

        // Обновление размера при изменении окна
        window.addEventListener('resize', () => {
            camera.aspect = container.offsetWidth / container.offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.offsetWidth, container.offsetHeight);
        });

        animate();
    </script>
</body>
</html>
