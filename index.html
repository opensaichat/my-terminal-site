<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OMEGA-AI // CORE 2026</title>
    <script src="https://cdnjs.cloudflare.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --gold: #ffcc00;
            --prism: linear-gradient(45deg, #ff0055, #00f2ff, #bc13fe);
            --bg: #000000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg);
            color: white;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; filter: contrast(1.2) brightness(1.1); }

        /* Эффект шума и зернистости */
        .film-grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org');
            opacity: 0.05; pointer-events: none; z-index: 100;
        }

        .interface {
            position: relative; z-index: 10;
            display: grid; height: 100vh;
            grid-template-columns: 350px 1fr 350px;
            grid-template-rows: 100px 1fr 100px;
            padding: 30px; box-sizing: border-box;
            pointer-events: none;
        }

        /* Стеклянные модули */
        .glass-module {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px; position: relative;
            pointer-events: all;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 90% 100%, 0 100%);
        }

        .header {
            grid-column: 1 / 4; display: flex; justify-content: space-between; align-items: center;
            background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-family: 'Unbounded', sans-serif;
            font-weight: 900; font-size: 28px; letter-spacing: -1px;
            background: var(--prism); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Нейронный поток */
        .neural-stream {
            font-size: 10px; line-height: 1.5; color: var(--gold);
            opacity: 0.7; height: 100%; overflow: hidden;
        }

        /* Виджеты */
        .widget { margin-bottom: 30px; }
        .label { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; margin-bottom: 5px; }
        .value { font-size: 18px; font-weight: bold; color: #00f2ff; }

        /* Футер */
        .footer { grid-column: 1 / 4; display: flex; justify-content: space-between; align-items: center; font-size: 10px; }

        .btn-action {
            padding: 10px 20px; border: 1px solid var(--gold); color: var(--gold);
            cursor: pointer; transition: 0.3s; pointer-events: all;
        }
        .btn-action:hover { background: var(--gold); color: black; box-shadow: 0 0 20px var(--gold); }
    </style>
</head>
<body>

    <div class="film-grain"></div>

    <div class="interface">
        <header class="header">
            <div class="logo">OMEGA // CORE</div>
            <div id="timer">STABLE_CONNECT_00:00:00</div>
            <div class="btn-action" onclick="pulseCore()">DECODE_QUANTUM</div>
        </header>

        <!-- Левая панель -->
        <aside class="glass-module" style="grid-row: 2;">
            <div class="widget">
                <div class="label">Neural Complexity</div>
                <div class="value" id="complexity">1.024 Qbit</div>
            </div>
            <div class="widget">
                <div class="label">Cognitive Sync</div>
                <div class="value" style="color: var(--gold);">ACTIVE 99%</div>
            </div>
            <hr style="opacity: 0.1">
            <div class="neural-stream" id="stream"></div>
        </aside>

        <!-- Пустой центр для 3D -->
        <div></div>

        <!-- Правая панель -->
        <aside class="glass-module" style="grid-row: 2;">
            <div class="widget">
                <div class="label">Environmental DNA</div>
                <div id="geo-data" style="font-size: 12px;">LOADING...</div>
            </div>
            <div class="widget">
                <div class="label">System Entropy</div>
                <div id="entropy-bar" style="height: 2px; background: var(--gold); width: 40%; box-shadow: 0 0 10px var(--gold);"></div>
            </div>
            <div style="font-size: 10px; margin-top: 50px; opacity: 0.4;">
                [ WARNING ]<br>
                HIGH_FREQUENCY_CORE_ACCESS_DETECTED.<br>
                PROCEED_WITH_CAUTION.
            </div>
        </aside>

        <footer class="footer">
            <div>&copy; 2026 NEURAL_SYSTEMS_INTL</div>
            <div style="letter-spacing: 5px;">A I _ I S _ W A T C H I N G</div>
            <div id="fps">FPS: 60.0</div>
        </footer>
    </div>

    <script>
        // 1. 3D СИНГУЛЯРНОСТЬ (УЛУЧШЕННАЯ)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Создаем Узел Торуса (Torus Knot) из частиц
        const geometry = new THREE.TorusKnotGeometry(10, 3, 200, 32);
        const particlesCount = 15000;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particlesCount * 3);

        for(let i=0; i < particlesCount * 3; i++) {
            pPos[i] = (Math.random() - 0.5) * 40;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));

        const pMat = new THREE.PointsMaterial({
            size: 0.015,
            color: 0xffffff,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });

        const points = new THREE.Points(pGeo, pMat);
        scene.add(points);

        // Второе ядро (Геометрическое)
        const coreGeo = new THREE.IcosahedronGeometry(8, 2);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff, wireframe: true, transparent: true, opacity: 0.1 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        camera.position.z = 30;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.05;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.05;
        });

        function pulseCore() {
            // Квантовый взрыв
            const pos = pGeo.attributes.position.array;
            for(let i=0; i<particlesCount * 3; i++) {
                pos[i] *= 1.5;
            }
            pGeo.attributes.position.needsUpdate = true;
            setTimeout(() => {
                // Плавный возврат (упрощенно)
                pMat.color.setHex(0xff0055);
            }, 100);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.0005;

            points.rotation.y += 0.002;
            points.rotation.x += 0.001;
            
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            // Анимация цвета
            pMat.color.setHSL(Math.sin(time * 0.1), 0.8, 0.6);
            
            renderer.render(scene, camera);
        }
        animate();

        // 2. ДАННЫЕ И ТЕРМИНАЛ
        const stream = document.getElementById('stream');
        setInterval(() => {
            const line = document.createElement('div');
            line.innerHTML = `> SYNCING_THOUGHT_${Math.random().toString(36).substring(7).toUpperCase()}`;
            stream.prepend(line);
            if(stream.childNodes.length > 20) stream.removeChild(stream.lastChild);
            
            document.getElementById('complexity').innerText = (Math.random() * 5).toFixed(3) + " Qbit";
            document.getElementById('entropy-bar').style.width = Math.random() * 100 + "%";
        }, 800);

        // 3. РЕАЛЬНОЕ IP И ГЕО
        fetch('https://ipapi.co').then(res => res.json()).then(data => {
            document.getElementById('geo-data').innerHTML = `IP: ${data.ip}<br>NODE: ${data.city}<br>ISP: ${data.org}`;
        });

        // Таймер
        setInterval(() => {
            document.getElementById('timer').innerText = `STABLE_CONNECT_${new Date().toLocaleTimeString()}`;
        }, 1000);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
